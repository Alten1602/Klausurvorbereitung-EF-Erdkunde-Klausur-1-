<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selbsttest Ökumene und Landschaftszonen</title>
<style>
:root{--bg:#f5f8f4;--card:#fff;--ink:#1d2b26;--muted:#4d625a;--pine:#163a2f;--teal:#1f6b55;--gold:#f2b84b;--tint:#e9f1ec;--line:#c8d9cf;--good:#2f7d32;--bad:#b5543c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1b17;--card:#172a23;--ink:#e9f2ee;--muted:#a9bfb6;--pine:#163a2f;--teal:#3aa282;--gold:#f6c766;--tint:#1d352c;--line:#2d493d;--good:#7bd07f;--bad:#f08a72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Calibri,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:18px;line-height:1.45}
header{background:var(--pine);color:#fff}
.bar{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-family:Cambria,Georgia,serif;font-size:20px;margin:0;flex:1}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.hero{background:var(--pine);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}
.hero .k{color:var(--gold);font-weight:700;letter-spacing:.12em;font-size:13px}
.hero h2{font-family:Cambria,Georgia,serif;font-size:29px;margin:6px 0 8px;line-height:1.15}
.hero p{margin:0;color:#dcebe3}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lv.done{background:var(--tint)}
.lv .no{display:inline-flex;width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:8px}
.lv h3{margin:0 0 4px;font-family:Cambria,Georgia,serif;font-size:21px;color:var(--pine)}
.lv p{margin:0;color:var(--muted);font-size:16px}
.lv .st{margin-top:8px;font-size:20px;letter-spacing:2px}
@media (prefers-color-scheme:dark){h2.t,.lv h3{color:#cfe8dc}}
h2.t{font-family:Cambria,Georgia,serif;color:var(--pine);margin:0 0 6px;font-size:26px}
.story{color:var(--muted);margin:0 0 14px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--teal);color:#fff;min-height:48px}
.btn.alt{background:var(--gold);color:#1d2b26}
.btn.ghost{background:var(--tint);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,.lv:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.row label{flex:1 1 280px}
select{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px;flex:1 1 220px;max-width:100%}
.ok{border-color:var(--good)!important}.no-{border-color:var(--bad)!important}
.msg{margin-top:12px;font-weight:700;min-height:1.4em}.msg.good{color:var(--good)}.msg.bad{color:var(--bad)}
.hint{background:var(--tint);border-radius:12px;padding:12px 14px;margin-top:12px;border:1px solid var(--line)}
.task{font-size:19px;font-weight:700;background:var(--tint);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.hidden{display:none!important}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sub{border-top:2px dashed var(--line);margin-top:18px;padding-top:14px}
.sub h3{margin:0 0 6px;font-family:Cambria,Georgia,serif;color:var(--pine)}
@media (prefers-color-scheme:dark){.sub h3{color:#cfe8dc}}
svg.cd{display:block;width:100%;max-width:520px;height:auto;margin:0 auto 6px;background:var(--card);border-radius:8px}
svg.cd text{fill:var(--ink);font-family:Calibri,"Segoe UI",system-ui,sans-serif}
.tf{display:flex;gap:8px;margin-top:6px}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ck input{width:24px;height:24px;margin-top:2px;flex:none}
.globewrap{max-width:460px;margin:0 auto}
.globewrap canvas{display:block;width:100%;aspect-ratio:1/1;touch-action:none;cursor:grab;border-radius:50%}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn.sm{padding:8px 12px;min-height:44px;min-width:48px}
.small{font-size:15px;color:var(--muted)}
.win{text-align:center}.big{font-size:54px;line-height:1}
</style>
</head>

function selectTask(box,items,btnLabel,okText,onDone,onError){
  var sels=[];

    var row=el("div",{class:"row"});row.appendChild(el("label",null,q[0]));
    var s=el("select",{"aria-label":q[0]});s.appendChild(el("option",{value:0},"– bitte wählen –"));

    row.appendChild(s);box.appendChild(row);sels.push(s);
  });
  var msg=el("div",{class:"msg"});var b=el("button",{class:"btn"},btnLabel);
  b.onclick=function(){
    var all=true;

  function densify(poly){
    var out=[];

  function Globe(opts){

 ,{title:"Klausur: Mandelanbau",teaser:"Schulbuch S. 60/61: drei Aufgaben mit Hilfen und Erwartungshorizont.",hint:"Gehe die Aufgaben der Reihe nach durch. Nutze die Hilfen erst, wenn du nicht weiterkommst. Zuerst selbst schreiben, dann den Erwartungshorizont öffnen.",
  build:function(b,c){
   b.appendChild(el("p",{class:"story"},"Thema: Mandelanbau in Kalifornien als Beispiel für die Subtropen. <b>Schlage dein Schulbuch auf Seite 60 und 61 auf</b> (Klausurtraining). Du brauchst die Materialien M1 bis M10: Atlaskarte, Mandelbauern (M2), Klimadiagramm Sacramento (M3), Mandelbaum (M4), Dürre-Index (M5, M6), Karte Mandelanbau (M7), Profil durch Zentralkalifornien (M8), Trockenheit (M9) und Klimawandel (M10). Schreibe jede Antwort ins Heft und rechne dann mit dem Erwartungshorizont nach."));
   var tasks=[
    {t:"Aufgabe 1 (AFB I/II): Beschreibe die Ansprüche des Mandelbaums an das Klima und prüfe die Eignung von Sacramento für den Mandelanbau. (Material: M3, M4)",
     helps:["<b>Operator:</b> „Beschreiben“ heißt, Merkmale sachlich und in Fachsprache wiederzugeben. „Prüfen“ heißt, an Kriterien zu messen und ein Fazit zu ziehen.","<b>Aufbau:</b> 1. Ansprüche des Mandelbaums (M4: Temperatur, Winterkälte, Frost, Trockenheit). 2. Klimadiagramm von Sacramento (M3) auswerten: Jahresmitteltemperatur, Jahresniederschlag, humide und aride Monate. 3. Vergleich und Fazit.","<b>Satzanfänge:</b> „Der Mandelbaum benötigt …“ · „Das Klimadiagramm zeigt für Sacramento …“ · „Damit ist der Standort … geeignet, weil …“"],
     ck:[["Einordnung: Der Mandelbaum ist ein typisches Gewächs der winterfeuchten Subtropen, wächst aber auch in warmen Regionen der gemäßigten Zone",1],["Temperatur: Optimal sind etwa 25 bis 30 °C; unter 15 °C und über 35 °C verlangsamt sich das Wachstum",2],["Kältebedarf: Für Blüteninduktion und Fruchtansatz sind etwa 200 bis 400 Stunden mit Temperaturen unter 7 °C nötig",1],["Frost: Der Baum ist winterhart, aber Fröste während der Blüte können zu Missernten führen",1],["Trockenheit: An heiße Sommer angepasst, bei zu trockenen Bedingungen aber Ertragsrückgänge, daher im kommerziellen Anbau Bewässerung",1],["M3 ausgewertet: Station, Lage (38°31′ N, 8 m ü. M.), Jahresmitteltemperatur etwa 16,5 °C, Jahresniederschlag etwa 420 mm (Werte im Diagramm ablesen)",2],["M3 Verlauf: Temperaturmaximum im Sommer (Juli/August), Niederschläge im Winter (humid), im Sommer ausgeprägte aride Zeit",1],["Fazit: Sommertemperaturen liegen im Wachstumsoptimum, Winterkälte für die Blüte ist vorhanden, der Standort ist gut geeignet, aber die sommerliche Trockenheit macht Bewässerung nötig",2]],
     muster:"Der Mandelbaum ist ein Gewächs der winterfeuchten Subtropen, wächst aber auch in warmen Regionen der gemäßigten Zone. Er wächst am besten bei 25 bis 30 °C, unter 15 °C und über 35 °C verlangsamt sich das Wachstum. Für die Blüte braucht er 200 bis 400 Stunden unter 7 °C. Er ist winterhart, Fröste in der Blüte können aber zu Missernten führen. Das Klimadiagramm von Sacramento (38°31′ N, 8 m ü. M.) zeigt eine Jahresmitteltemperatur von etwa 16,5 °C und einen Jahresniederschlag von etwa 420 mm. Der Sommer ist warm bis heiß und trocken (arid), der Winter mild und feucht (humid). Damit stimmen Sommerwärme und Winterkälte mit den Ansprüchen überein. Sacramento ist klimatisch gut geeignet, im Sommer ist aber Bewässerung nötig."},
    {t:"Aufgabe 2 (AFB II): Erläutere die Verbreitung des Mandelanbaus unter Berücksichtigung der Wasserverfügbarkeit und der Bewässerungsmöglichkeiten. (Material: M2, M4, M7, M8)",
     helps:["<b>Operator:</b> „Erläutern“ heißt, einen Sachverhalt mit Gründen und Beispielen nachvollziehbar zu machen (nicht nur nennen).","<b>Aufbau:</b> 1. Wo liegt der Anbau (M7)? 2. Warum dort: Relief und Niederschlag (M8: Regenschatten, Sierra Nevada, Schnee). 3. Bewässerung und Wasserbedarf (M2, M4). 4. Zusammenfassung.","<b>Satzanfänge:</b> „Die Karte zeigt, dass der Anbau vor allem … liegt.“ · „Das liegt daran, dass …“ · „Deshalb ist … notwendig.“"],
     ck:[["M7: Der Anbau konzentriert sich auf das Central Valley (vor allem das mittlere und südliche Tal, zum Beispiel Counties wie Fresno, Kern, Stanislaus), nicht auf die Küste und nicht auf das Gebirge",2],["M8: Das Küstengebirge fängt Niederschläge ab (Luv), das Central Valley liegt im Regenschatten und ist trocken (Stationen wie Fresno oder Mendota mit geringem Niederschlag)",2],["M8: In der Sierra Nevada steigen die Luftmassen auf, es fällt viel Regen und Schnee (Giant Forest), östlich davon (Independence) ist es wieder trocken",1],["Wasserquelle: Im Sommer fällt im Tal kaum Regen, das Wasser stammt aus der Schneeschmelze der Sierra Nevada, geleitet über Flüsse, Kanäle und Stauseen, ergänzt durch Grundwasser",2],["Wasserbedarf: etwa 13 000 Liter pro Kilogramm Mandeln, mehr als 15 % des verfügbaren Wassers Kaliforniens (Landwirtschaft insgesamt etwa 80 %)",1],["Zusammenfassende Erklärung: Mandeln werden dort angebaut, wo Wärme, Winterkälte, geeignete Böden und gesicherte Bewässerung zusammentreffen",1]],
     muster:"Der Mandelanbau konzentriert sich nach M7 auf das Central Valley, vor allem im mittleren und südlichen Teil. Das Tal liegt zwischen dem Küstengebirge und der Sierra Nevada. Nach M8 regnen sich die Wolken am Küstengebirge ab, sodass das Central Valley im Regenschatten liegt und nur wenig Niederschlag erhält. Viel Niederschlag fällt dagegen in der Sierra Nevada, vor allem als Schnee. Im Sommer ist das Tal trocken, deshalb ist Bewässerung nötig. Das Wasser stammt aus der Schneeschmelze der Sierra Nevada und wird über Flüsse und Kanäle ins Tal geleitet, dazu kommt Grundwasser. Mandelbäume brauchen etwa 13 000 Liter Wasser pro Kilogramm. Der Anbau liegt also dort, wo das Klima passt und Wasser durch Bewässerung verfügbar gemacht werden kann."},
    {t:"Aufgabe 3 (AFB III): Beurteile mögliche Zukunftsaussichten für den Mandelanbau in Kalifornien, auch vor dem Hintergrund des Klimawandels. (Material: M2, M5, M6, M9, M10)",
     helps:["<b>Operator:</b> „Beurteilen“ heißt, Pro und Contra abzuwägen und zu einem begründeten Urteil zu kommen, das du selbst formulierst.","<b>Aufbau:</b> 1. Argumente für eine Zukunft. 2. Argumente gegen eine Zukunft (M5/M6 Dürre-Index, M10 Schneedecke und Hitzewellen, M9 Trockenheit). 3. Abwägen und eigenes Urteil mit Begründung, zum Beispiel mit Anpassungsmöglichkeiten.","<b>Satzanfänge:</b> „Für den Mandelanbau spricht …“ · „Dagegen spricht …“ · „Insgesamt halte ich … für …, weil …“"],
     ck:[["Pro: Wirtschaftliche Bedeutung und Struktur: über 7 600 Betriebe, fast 90 % Familienbetriebe, über 90 % der Mandeln werden im Land verarbeitet (M2)",1],["Pro: Der Baum ist an heiße Sommer angepasst; Anpassung durch wassersparende Bewässerung und Technik denkbar",1],["Contra (M5/M6): Der Dürre-Index zeigt wiederkehrende Dürrejahre, in jüngster Zeit längere und stärkere Trockenphasen (negative Werte, zum Teil schwere bis extreme Dürre)",1],["Contra (M10): Die Schneedecke der Sierra Nevada ging zwischen 1955 und 2023 um etwa 18 % zurück, die Schneesaison ist etwa 15 Tage kürzer",1],["Contra (M10): Die Wasserspeicher sind auf die Schneeschmelze ausgelegt, höhere Temperaturen führen zu früherer und schnellerer Schmelze, das Wasser fehlt im Sommer",1],["Contra (M10): Hitzewellen werden häufiger und intensiver (Hitzestress über 35 °C), wärmere Winter können den Kältebedarf für die Blüte gefährden",1],["Konkurrenz um Wasser: Landwirtschaft nutzt etwa 80 %, Haushalte und Industrie etwa 20 %, Mandeln brauchen viel Wasser (Konfliktpotenzial, Kritik am Wasserverbrauch)",1],["Abwägung der Argumente (Gewichtung: Welche Argumente wiegen schwerer und warum?)",1],["Eigenes begründetes Urteil (zum Beispiel: eingeschränkte Zukunft, nur mit Anpassung)",1],["Fachsprache und Materialbezug (M-Nummern, Zahlen) im Urteil genutzt",1]],
     muster:"Für den Mandelanbau spricht seine wirtschaftliche Bedeutung: Es gibt über 7 600 Betriebe, meist Familienbetriebe, und über 90 % der Mandeln werden im Land verarbeitet (M2). Der Baum ist an heiße Sommer angepasst, und wassersparende Bewässerung kann den Verbrauch senken. Dagegen sprechen die zunehmenden Dürren (M5, M6): Der Dürre-Index zeigt in jüngster Zeit längere Trockenphasen. Nach M10 ist die Schneedecke der Sierra Nevada zwischen 1955 und 2023 um etwa 18 % zurückgegangen, die Schneesaison ist etwa 15 Tage kürzer. Weil die Speicher auf die Schneeschmelze ausgelegt sind und der Schnee früher schmilzt, fehlt im Sommer Wasser. Hitzewellen belasten die Bäume zusätzlich. Dazu konkurrieren Landwirtschaft (etwa 80 % des Wassers), Haushalte und Industrie um das knappe Wasser. Insgesamt halte ich die Zukunftsaussichten für eingeschränkt: Der Anbau bleibt nur mit Anpassung (sparsame Bewässerung, weniger Fläche, andere Kulturen) möglich, weil das Wasserproblem mit dem Klimawandel wächst."}
   ];

      var md=el("details",{style:"margin-top:12px"});md.appendChild(el("summary",{style:"cursor:pointer;font-weight:700"},"Beispiel für eine vollständige Antwort"));md.appendChild(el("p",null,tk.muster));eh.appendChild(md);
    };

function showHome(){
  window.scrollTo(0,0);app.innerHTML="";
  app.appendChild(el("section",{class:"hero"},'<div class="k">ERDKUNDE · EINFÜHRUNGSPHASE NRW</div><h2>Selbsttest: Ökumene, Anökumene und Landschaftszonen</h2><p>Neun Level zur Vorbereitung auf die Klausur. Ohne Atlas, mit Sofort-Rückmeldung und bis zu drei Sternen pro Level. Dein Fortschritt bleibt auf diesem Gerät gespeichert.</p>'));
  var g=el("div",{class:"grid"});
  levels.forEach(function(lv,i){
    var d=state.done[i]!=null;
    var b=el("button",{class:"lv"+(d?" done":""),type:"button"},'<span class="no">'+(i+1)+'</span><h3>'+lv.title+'</h3><p>'+lv.teaser+'</p><div class="st">'+starStr(d?state.done[i]:0)+'</div>');
    b.onclick=function(){showLevel(i);};g.appendChild(b);
  });
  app.appendChild(g);
  if(Object.keys(state.done).length===levels.length)app.appendChild(el("div",{class:"card win",style:"margin-top:16px"},'<div class="big">🏆</div><h2 class="t">Klausurfit!</h2><p>'+totalStars()+' von '+(levels.length*3)+' Sternen.</p>'));
  var r=el("p",{style:"margin-top:20px"});var rb=el("button",{class:"btn ghost",type:"button"},"Sterne zurücksetzen");
  rb.onclick=function(){if(confirm("Alle Sterne löschen?")){state={done:{}};save();updTotal();showHome();}};
  r.appendChild(rb);app.appendChild(r);updTotal();
}
function showLevel(i){
  window.scrollTo(0,0);app.innerHTML="";globes.length=0;
  var lv=levels[i],errors=0;
  var back=el("button",{class:"btn ghost"},"← Zur Übersicht");back.onclick=showHome;
  var card=el("div",{class:"card",style:"margin-top:12px"},'<h2 class="t">Level '+(i+1)+': '+lv.title+'</h2>');
  var box=el("div");card.appendChild(box);var res=el("div");
  var c={ownErrors:false,
    error:function(){if(!c.ownErrors)errors++;},
    setErrors:function(n){errors=n;},
    done:function(){
      var st=starsFor(errors),prev=state.done[i];if(prev==null||st>prev){state.done[i]=st;save();}updTotal();
      res.innerHTML='<div class="task" style="margin-top:14px">Level geschafft: <span style="letter-spacing:3px">'+starStr(st)+'</span> ('+errors+' Fehlversuch'+(errors===1?'':'e')+')</div>';
      var nx=el("button",{class:"btn alt"},i<levels.length-1?"Nächstes Level →":"Zur Übersicht");
      nx.onclick=function(){if(i<levels.length-1)showLevel(i+1);else showHome();};res.appendChild(nx);
    }};
  lv.build(box,c);card.appendChild(res);
  var hb=el("button",{class:"btn ghost",style:"margin-top:12px"},"💡 Tipp");var hx=el("div",{class:"hint hidden"},lv.hint);
  hb.onclick=function(){hx.classList.remove("hidden");hb.disabled=true;};
  card.appendChild(hb);card.appendChild(hx);app.appendChild(back);app.appendChild(card);
  globes.forEach(function(g){g.render();});
}
updTotal();var hm=/^#l(\d)$/.exec(location.hash||"");if(hm&&levels[+hm[1]-1])showLevel(+hm[1]-1);else showHome();
})();
